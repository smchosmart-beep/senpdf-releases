# 쎈PDF 릴리스 게시: Claude가 빌드·서명한 파일을 upload 브랜치로 올리면 이 워크플로가 GitHub 릴리스로 게시한다.
# - upload 브랜치에 release.json이 있을 때만 게시(파일을 여러 번 나눠 올리는 동안은 건너뜀)
# - 큰 파일은 *.partNN 조각으로 올라오며, 여기서 다시 합치고 SHA-256을 확인한다
# - release.json의 mode가 append면 이미 있는 릴리스에 파일을 추가·교체한다(--add-full)
# - 게시 후 upload 브랜치는 지운다(저장소가 커지지 않게)
name: publish
on:
  push:
    branches: [upload]
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload
      - name: release.json 확인
        id: check
        run: |
          if [ -f release.json ]; then echo "ready=1" >> "$GITHUB_OUTPUT"; else echo "release.json 없음 — 아직 올리는 중이므로 건너뜀"; fi
      - name: 조각 합치기 + SHA-256 확인
        if: steps.check.outputs.ready == '1'
        run: |
          node -e '
            const fs=require("fs"),crypto=require("crypto");
            const r=JSON.parse(fs.readFileSync("release.json","utf8"));
            fs.mkdirSync("out",{recursive:true});
            for(const a of r.assets){
              const buf=Buffer.concat(a.parts.map(p=>fs.readFileSync(p)));
              const sha=crypto.createHash("sha256").update(buf).digest("hex");
              if(buf.length!==a.size||sha!==a.sha256){console.error("검증 실패: "+a.name);process.exit(1);}
              fs.writeFileSync("out/"+a.name,buf);console.log("확인 "+a.name+" "+a.size);
            }
            fs.writeFileSync("out/.tag",r.tag);fs.writeFileSync("out/.title",r.title);fs.writeFileSync("out/.mode",r.mode||"create");
          '
      - name: GitHub 릴리스 게시
        if: steps.check.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat out/.tag); TITLE=$(cat out/.title); MODE=$(cat out/.mode)
          if [ "$MODE" = "append" ]; then
            # 이미 게시된 릴리스에 파일 추가·교체(예: 전체 설치본을 나중에 붙이고 매니페스트를 다시 서명한 것으로 바꿈)
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "추가할 릴리스가 없음: $TAG"; exit 1; }
            gh release upload "$TAG" out/*.exe out/*.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "이미 게시된 태그: $TAG"; exit 1; fi
          gh release create "$TAG" out/*.exe out/*.json --repo "$GITHUB_REPOSITORY" --target main --title "$TITLE" --notes-file notes.md --latest
      - name: upload 브랜치 정리
        if: steps.check.outputs.ready == '1'
        run: git push origin --delete upload
